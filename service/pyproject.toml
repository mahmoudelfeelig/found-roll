[project]
name = "found-roll-service"
version = "0.1.0"
description = "Policy-bound custody service for the synthetic Found Roll demo"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
